# 3D Torsion Memory Lattice Configuration
# Long-term, self-healing, noise-resistant identity memory

default_config:
  # Lattice dimensions
  size: 5                    # 5x5x5 grid = 125 nodes

  # XY-model physics parameters
  coupling_strength: 0.8     # Neighbor coupling coefficient
  decay_gamma: 0.03          # Magnitude decay rate (self-healing)

  # Memory integration parameters
  write_strength: 0.03       # Weak write coefficient (α_write < 0.05)
  noise_level: 0.0           # Thermal noise (for robustness testing)

  # Synchronization control
  sync_interval_steps: 300   # Background update frequency (0.1-2 Hz range)

  # Möbius stability filtering
  torsion_threshold: 0.2     # Only commit states with torsion < 0.2

  # Relaxation dynamics
  relaxation_steps: 20       # XY-model relaxation iterations per sync
