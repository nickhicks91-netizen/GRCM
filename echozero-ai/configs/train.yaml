# Training configuration for EchoZero-Hybrid

defaults:
  - data: deap

# Model architecture
model:
  dim: 256
  num_classes: 2
  input_channels: 1
  reservoir_dim: 512
  reservoir_size: 256
  num_heads: 8
  rtf_depth: 4
  dropout: 0.1
  use_purpose_gate: true
  use_echo_core: true
  use_retention: true
  use_tea: true
  use_rtf: true

# Training parameters
train:
  epochs: 100
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 10
  num_workers: 4
  gradient_clip: 1.0

  # Learning rate schedule
  lr_schedule: cosine  # Options: cosine, step, constant
  lr_min: 0.00001

  # Early stopping
  early_stopping: true
  patience: 15

  # Checkpointing
  save_every: 5
  save_best: true

# Loss weights
loss:
  retention_weight: 0.01
  diversity_weight: 0.001
  target_retention: 0.7

# Optimization
optimizer: adamw  # Options: adam, adamw, sgd

# Logging
logging:
  log_dir: ./experiments
  log_every: 10
  use_tensorboard: true

# Reproducibility
seed: 42

# Device
device: cuda  # Options: cuda, cpu, auto
