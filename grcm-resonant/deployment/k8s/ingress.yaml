apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grcm-ingress
  namespace: grcm-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  tls:
  - hosts:
    - api.grcm.example.com
    - ui.grcm.example.com
    secretName: grcm-tls
  rules:
  - host: api.grcm.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grcm-api-service
            port:
              number: 80
  - host: ui.grcm.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grcm-gradio-service
            port:
              number: 7860
---
apiVersion: v1
kind: Namespace
metadata:
  name: grcm-prod
  labels:
    name: grcm-prod
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: grcm-quota
  namespace: grcm-prod
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: grcm-limits
  namespace: grcm-prod
spec:
  limits:
  - max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "500m"
      memory: "1Gi"
    type: Container
