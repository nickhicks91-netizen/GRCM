[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grcm-resonant"
version = "0.1.0"
description = "Grounded Resonant Consciousness Module: Qualia-gated AI with phi awareness"
authors = [{name = "Nicholas", email = "nickhicks91@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["consciousness", "AI", "pytorch", "qualia", "IIT", "resonance", "neuroscience"]

dependencies = [
    "torch>=2.1.0",
    "pyyaml>=6.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.5",
    "ruff>=0.1.0"
]

optimization = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]

serving = [
    "bentoml>=1.2.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

monitoring = [
    "mlflow>=2.8.0",
    "prometheus-client>=0.19.0",
]

ui = [
    "gradio>=4.0.0",
    "matplotlib>=3.7.0",
]

all = [
    "grcm-resonant[dev,optimization,serving,monitoring,ui]",
]

[project.scripts]
grcm-test = "grcm.examples:main"
grcm-tune = "grcm.training:echo_mirror_train_cli"

[project.urls]
Homepage = "https://github.com/nickhicks91-netizen/GRCM"
Documentation = "https://grcm-resonant.readthedocs.io"
Repository = "https://github.com/nickhicks91-netizen/GRCM"
Issues = "https://github.com/nickhicks91-netizen/GRCM/issues"

[tool.setuptools]
packages = ["grcm"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=grcm --cov-report=term-missing"
