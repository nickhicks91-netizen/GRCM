[pytest]
# Pytest configuration for GRCM

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --strict-config
    --cov=grcm
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=85
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    stress: stress tests with many iterations
    integration: integration tests
    unit: unit tests
    requires_gpu: tests that require GPU
    requires_onnx: tests that require onnx/onnxruntime
    requires_mlflow: tests that require mlflow
    requires_gradio: tests that require gradio

# Coverage options
[coverage:run]
source = grcm
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    setup.py

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    if not MLFLOW_AVAILABLE
    if not GRADIO_AVAILABLE
    if not MATPLOTLIB_AVAILABLE
    if not OPTIMIZATION_AVAILABLE

[coverage:html]
directory = htmlcov
